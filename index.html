    <style>
      /* Skip nav (visible only on focus) */
      .skip-nav {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 1000;
        background: #1a3d2e;
        color: #fff;
        padding: 8px 16px;
        border-radius: 0 0 8px 0;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 600;
        text-decoration: none;
      }
      .skip-nav:focus {
        left: 0;
        outline: 3px solid #f5c542;
      }

      /* Inline boot skeleton — shown until React mounts */
      #ks-boot {
        position: fixed;
        inset: 0;
        background: #faf8f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      #ks-boot img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 8px 24px rgba(26, 61, 46, 0.18);
        margin-bottom: 18px;
      }
      #ks-boot .ks-name {
        color: #1a3d2e;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 14px;
      }
      #ks-boot .ks-bar {
        position: relative;
        width: 180px;
        height: 4px;
        background: rgba(26, 61, 46, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      #ks-boot .ks-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #1a3d2e, #f5c542);
        border-radius: 999px;
        animation: ks-load 1.2s ease-in-out infinite;
      }
      @keyframes ks-load {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>

  <body>
    <a href="#main-content" class="skip-nav">Skip to main content</a>
    <div id="root">
      <div id="ks-boot" role="status" aria-label="Loading Kinsroot">
        <img src="/logo.jpg" alt="" />
        <div class="ks-name">Kinsroot</div>
        <div class="ks-bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
