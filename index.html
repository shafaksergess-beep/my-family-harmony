<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3d2e" />
    <meta name="msapplication-TileColor" content="#1a3d2e" />
    <meta name="google-site-verification" content="ibe2m6wipvTUTDNE68GrTQDCXGIi_vfOq5fmiyFC75g" />

    <!-- Baseline CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src 'self' https:;" />

    <!-- Favicons -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="shortcut icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/logo.jpg" fetchpriority="high" />

    <title>Kinsroot — Rooted in Heritage, Built for Tomorrow</title>
    <meta name="description" content="Kinsroot is the all-in-one family management platform for meetings, contributions, savings, loans and heritage — rooted in tradition, built for tomorrow." />
    <meta name="keywords" content="Kinsroot, family management, family meetings, contributions, savings, njangi, loans, heritage, family app" />
    <meta name="author" content="Kinsroot" />
    <meta name="application-name" content="Kinsroot" />
    <!-- Canonical is set per-route by the SEO component (react-helmet-async) -->
    <meta property="og:url" content="https://kinsroot.softgroupsolutions.com/" />

    <!-- iOS / mobile web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kinsroot" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kinsroot" />
    <!-- og:url is set per-route by the SEO component (react-helmet-async) -->
    <meta property="og:title" content="Kinsroot — Rooted in Heritage, Built for Tomorrow" />
    <meta property="og:description" content="The all-in-one family management platform for meetings, contributions, savings, loans and heritage." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://kinsroot.softgroupsolutions.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kinsroot — Rooted in Heritage, Built for Tomorrow" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Kinsroot" />
    <meta name="twitter:title" content="Kinsroot — Rooted in Heritage, Built for Tomorrow" />
    <meta name="twitter:description" content="The all-in-one family management platform for meetings, contributions, savings, loans and heritage." />
    <meta name="twitter:image" content="https://kinsroot.softgroupsolutions.com/og-image.png" />

    <!-- Structured data: Organization + SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Kinsroot",
          "url": "https://kinsroot.softgroupsolutions.com/",
          "logo": "https://kinsroot.softgroupsolutions.com/favicon.jpg",
          "sameAs": []
        },
        {
          "@type": "SoftwareApplication",
          "name": "Kinsroot",
          "applicationCategory": "LifestyleApplication",
          "operatingSystem": "Web, iOS, Android",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "description": "All-in-one family management platform for meetings, contributions, savings, loans and heritage.",
          "url": "https://kinsroot.softgroupsolutions.com/"
        }
      ]
    }
    </script>

    <style>
      /* Skip nav (visible only on focus) */
      .skip-nav {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 1000;
        background: #1a3d2e;
        color: #fff;
        padding: 8px 16px;
        border-radius: 0 0 8px 0;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 600;
        text-decoration: none;
      }
      .skip-nav:focus {
        left: 0;
        outline: 3px solid #f5c542;
      }

      /* Inline boot skeleton — shown until React mounts */
      #ks-boot {
        position: fixed;
        inset: 0;
        background: #faf8f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      #ks-boot img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 8px 24px rgba(26, 61, 46, 0.18);
        margin-bottom: 18px;
      }
      #ks-boot .ks-name {
        color: #1a3d2e;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 14px;
      }
      #ks-boot .ks-bar {
        position: relative;
        width: 180px;
        height: 4px;
        background: rgba(26, 61, 46, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      #ks-boot .ks-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #1a3d2e, #f5c542);
        border-radius: 999px;
        animation: ks-load 1.2s ease-in-out infinite;
      }
      @keyframes ks-load {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>

  <body>
    <a href="#main-content" class="skip-nav">Skip to main content</a>
    <div id="root">
      <div id="ks-boot" role="status" aria-label="Loading Kinsroot">
        <img src="/logo.jpg" alt="" width="96" height="96" decoding="async" />
        <div class="ks-name">Kinsroot</div>
        <div class="ks-bar" aria-hidden="true"></div>
      </div>
    </div>
    <noscript>
      <div style="max-width:720px;margin:48px auto;padding:24px;font-family:Inter,system-ui,sans-serif;color:#1a3d2e;text-align:center;">
        <img src="/logo.jpg" alt="Kinsroot logo" width="96" height="96" style="border-radius:50%;margin-bottom:16px;" />
        <h1 style="font-family:'Playfair Display',serif;font-size:32px;margin:0 0 12px;">Kinsroot — Rooted in Heritage, Built for Tomorrow</h1>
        <p style="font-size:18px;line-height:1.6;margin:0 0 16px;">
          The all-in-one family management platform for meetings, contributions, savings,
          loans and heritage. Bring your family together with shared finances,
          rotating njangi, attendance tracking and a private family chat.
        </p>
        <p style="font-size:16px;margin:0 0 24px;">
          Features include: family meetings &amp; QR check-in, contributions &amp; wallets,
          savings &amp; njangi, loans with surety, shares &amp; dividends, assistance management,
          family chat and multilingual support (EN · FR).
        </p>
        <p>
          <a href="/auth" style="display:inline-block;background:#1a3d2e;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;">
            Get started — Sign in or create a family
          </a>
        </p>
        <p style="margin-top:24px;font-size:14px;color:#555;">
          JavaScript is required for the full Kinsroot experience. Please enable JavaScript in your browser.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
