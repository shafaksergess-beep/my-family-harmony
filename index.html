<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a3d2e" />
    <meta name="msapplication-TileColor" content="#1a3d2e" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Kinsroot - Rooted in Heritage, Built for Tomorrow</title>
    <meta
      name="description"
      content="Kinsroot - Family reunion management platform. Rooted in Heritage, Built for Tomorrow. Digitizing unity and prosperity for families."
    />
    <meta name="author" content="Kinsroot" />
    <meta name="application-name" content="Kinsroot" />

    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kinsroot" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Android specific -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Prevent automatic detection -->
    <meta
      name="format-detection"
      content="telephone=no, date=no, email=no, address=no"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta
      property="og:image"

    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta
      name="twitter:image"
      content="https://lovable.dev/opengraph-image-p98pqg.png"
    />
    <meta
      property="og:title"

    />
    <meta

      content="Kinsroot - Rooted in Heritage, Built for Tomorrow"
    />
    <meta
      property="og:description"
      content="Kinsroot - Family reunion management platform. Rooted in Heritage, Built for Tomorrow."
    />
    <meta
      name="twitter:description"
      content="Kinsroot - Family reunion management platform. Rooted in Heritage, Built for Tomorrow."
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var supportDarkMode =
            window.matchMedia("(prefers-color-scheme: dark)").matches === true;
          if (theme === "dark" || (theme !== "light" && supportDarkMode)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
